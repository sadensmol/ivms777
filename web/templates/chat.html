{% extends "base.html" %}
{% block title %}Chat — ivms777{% endblock %}
{% block content %}
<div class="chat">
  <div class="chat-head">
    <div>
      <h1>Chat</h1>
      <div class="chat-model" id="chat-model" data-model="{{ model }}">
        model: <strong>{{ model }}</strong><span id="chat-tps"></span>
      </div>
    </div>
    <form method="post" action="/chat/new">
      <button type="submit" class="new-session">New session</button>
    </form>
  </div>
  <div id="chat-log" class="chat-log">
    {% for m in messages %}
      <div class="msg user"><div class="bubble">{{ m.question }}</div></div>
      <div class="msg assistant">
        <div class="bubble">{{ m.answer_html|safe }}</div>
        {% if m.memory_html %}<div class="msg-memory">{{ m.memory_html|safe }}</div>{% endif %}
      </div>
    {% endfor %}
  </div>
  <form id="chat-form" class="chat-input" onsubmit="return askLibrary(event)">
    <textarea id="chat-q" name="q" rows="4" autocomplete="off"
              placeholder="Ask about your photos — “what lens did I use most in Italy?”  (Shift+Enter for a new line)"></textarea>
    <button id="chat-send" type="submit">Ask</button>
  </form>
</div>
<script src="/static/chat.js?v={{ static_v('chat.js') }}"></script>
{% endblock %}
