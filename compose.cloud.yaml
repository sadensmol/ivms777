# Cloud profile: fully containerised on a Linux box with an NVIDIA GPU.
#
# vLLM earns its place here — continuous batching matters once several people
# index libraries at once, and on CUDA it supports vision models.
services:
  inference:
    image: vllm/vllm-openai:latest
    command: ["--model", "${VLLM_MODEL:?set VLLM_MODEL}", "--port", "8000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8001:8000"

  # app/worker are thin clients (design §5.1, plan 15 task 6) — no GPU, no
  # torch, just the network hop to `models:9000`.
  app:
    environment:
      IVMS777_PROFILE: cloud
    depends_on: [models]
  worker:
    environment:
      IVMS777_PROFILE: cloud
    depends_on: [models]

  # SigLIP runs in-process with embed_device=cuda, so the `models` service
  # needs the GPU reservation — not just the vLLM inference container. Its HF
  # cache (`ivms777-models`) already comes from the base compose.yaml.
  models:
    environment:
      IVMS777_PROFILE: cloud
    depends_on: [inference]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
