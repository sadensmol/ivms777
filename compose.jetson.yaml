# Jetson profile (JetPack 7): fully containerised.
#
# The NVIDIA container runtime hands the Orin iGPU to containers on JetPack 7, so
# GPU is available inside the services that declare `runtime: nvidia`. 8 GB shared
# memory means one small model — plan 16 runs a single gemma4-E2B GGUF.
#
# Since plan 18 there is NO separate `inference` service: the `models` container
# is the single model process AND owns gemma's lifecycle — it spawns the
# PROPERLY-BUILT sm_87 cu132 `llama-server` (baked into its own image,
# Dockerfile.models.jetson) as a child process on :8080, and loads/evicts it (plus
# SigLIP + nomic) through its conveyor (design §3.1/§5.1/§8.1). app/worker stay
# thin clients with no GPU.
services:
  app:
    build: .
    environment:
      IVMS777_PROFILE: jetson
      IVMS777_PLANNER_MODEL: ${IVMS777_PLANNER_MODEL:-gemma4-E2B}
      # Thin clients, but an upload burst (206 photos) left each holding ~640 MB of
      # anonymous glibc arena across 113 mappings — one per-thread arena for 18
      # threads on a 6-core box. Two arenas trade a little malloc contention for
      # RAM we do not have (§8.1).
      MALLOC_ARENA_MAX: "2"
    depends_on: [models]
  worker:
    build: .
    environment:
      IVMS777_PROFILE: jetson
      IVMS777_PLANNER_MODEL: ${IVMS777_PLANNER_MODEL:-gemma4-E2B}
      MALLOC_ARENA_MAX: "2"
    depends_on: [models]

  # The one model process: SigLIP + nomic (cu132 torch, embed_device=cuda) AND the
  # sm_87 cu132 llama-server it supervises for gemma (text + vision). Builds from
  # Dockerfile.models.jetson (cu132 base + llama.cpp build stage). Mounts the GGUFs
  # at /data/models where build_llm_process (plan 18) looks for them.
  models:
    build:
      context: .
      dockerfile: Dockerfile.models.jetson
    runtime: nvidia
    environment:
      # The slim/runtime base doesn't declare these; without them the nvidia
      # runtime injects no driver libs and torch (and llama-server) see no GPU.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      IVMS777_PROFILE: jetson
      IVMS777_CAPTION_MODEL: ${IVMS777_CAPTION_MODEL:-gemma4-E2B}
      IVMS777_PLANNER_MODEL: ${IVMS777_PLANNER_MODEL:-gemma4-E2B}
      # The models service spawns llama-server on localhost and points its own
      # OpenAI client at it (plan 18) — no separate inference host.
      IVMS777_INFERENCE_BASE_URL: http://localhost:8080/v1
      # The spawned binary's ggml CUDA libs live beside it in the llamacpp volume;
      # the child gets this on its LD_LIBRARY_PATH (build_llm_process, plan 18).
      IVMS777_LLM_LDPATH: /llamacpp/llama.cpp/build/bin
    volumes:
      - ivms777-data:/data
      - llamacpp:/llamacpp             # prebuilt sm_87 llama-server binary + ggml libs (reused, no recompile)
      - llama-models:/data/models       # gemma GGUF + mmproj (already populated on the board)
    ports:
      - "8080:8080"   # llama-server, exposed for debugging

volumes:
  # The prebuilt sm_87 llama-server binary + ggml CUDA libs, built ONCE out-of-band
  # (Dockerfile.llamacpp.jetson) into this external volume and REUSED — never
  # recompiled by the models image. `external` = use as-is, never recreate.
  llamacpp:
    external: true
  # gemma GGUF + mmproj (already populated on the board; a fresh board fetches once).
  llama-models:
