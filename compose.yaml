# Photos arrive by upload from the browser — there is no host mount. Originals
# and derived data live on the named volume under /data.
#
# `app`/`worker` are thin clients (design §5.1, plan 15 task 6) — no torch, no
# GPU, no HF cache. Every model lives in the `models` service, reached over
# HTTP at `models:9000` (config.models_base_url default).
services:
  app:
    build: .
    environment:
      IVMS777_PROFILE: ${IVMS777_PROFILE:-mac}
      IVMS777_DATA_DIR: /data
      # The `worker` below owns ingest (§5). Without this the upload-finish
      # handler drains the whole queue inline too, holding the request open for
      # minutes and racing the worker for the GPU (config.inline_drain).
      IVMS777_INLINE_DRAIN: "false"
    volumes:
      - ivms777-data:/data           # uploads, db, thumbnails — Docker volume only
    ports:
      - "8000:8000"
    depends_on: [models]

  worker:
    build: .
    command: ["uv", "run", "--no-sync", "python", "-m", "ingest.cli"]
    environment:
      IVMS777_PROFILE: ${IVMS777_PROFILE:-mac}
      IVMS777_DATA_DIR: /data
    volumes:
      - ivms777-data:/data
    depends_on: [models]

  models:
    build:
      context: .
      dockerfile: Dockerfile.models
    environment:
      IVMS777_PROFILE: ${IVMS777_PROFILE:-mac}
      IVMS777_DATA_DIR: /data
    volumes:
      - ivms777-data:/data
      - ivms777-models:/root/.cache/huggingface  # SigLIP/caption weights, downloaded once

volumes:
  ivms777-data:
  ivms777-models:
