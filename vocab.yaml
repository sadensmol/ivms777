# Editable taxonomy vocabulary — ten dimensions (docs/design.md §7).
# Add or remove labels here; re-scoring a changed dimension only re-runs the
# cheap SigLIP taxonomy stage (use "Reprocess all photos" on /upload after editing).
#
# SigLIP zero-shot is a PER-DIMENSION classifier, not an absolute detector: its
# raw sigmoid probabilities are tiny (~1e-4) and near-uniform, so an absolute
# floor tags nothing. Each dimension is instead scored by a softmax over ITS OWN
# labels — the winning label always wins, and a runner-up is kept only when its
# probability is within `select_ratio` of the top's, up to `max_per_dim` labels.
max_per_dim: 3
select_ratio: 0.5
# "Similar photos" (§9): how hard each GROUP of dimensions pulls when comparing two
# photos. A weight is the most that signal may ever claim on its own, on the same
# 0–1 scale as the image, caption and moment signals in `search/signals.py`.
#
#   subject 0.75  what the photo IS — the ONLY tag tier that can make two photos
#                 similar by itself, and the most reliable dimension by far
#                 (median top-score 0.83; 93% of photos clear 0.5).
#   where   0.40  setting + occasion. WHERE it was, WHICH event. Reorders a match,
#                 never creates one.
#   look    0.12  light, season_weather, palette, vibe, composition, emotion —
#                 how it LOOKS. Measured worst: `emotion` clears 0.5 on 28% of
#                 photos and `surprised` lands on half the library, objects
#                 included. Two photos shot top-down in cool light are not
#                 "the same thing".
#   quality 0.03  sharpness — a pure tiebreak. `sharp` is on 201/206 photos, so idf
#                 cuts it to ~0.01 in practice. It can never qualify anything.
#
# These replaced ten hand-tuned per-dimension numbers that could not be reasoned
# about. `idf` already handles the part that genuinely varies — how RARE a specific
# label is — so a shared `museum` still outranks a shared `indoor` without either
# needing a weight of its own. Tune freely; the gates live in `search/signals.py`.
similar_tier_weights:
  subject: 0.75
  where: 0.40
  look: 0.12
  quality: 0.03
dimensions:
  # `subject` is the ONE content dimension (§9), so its labels must be mutually
  # exclusive — softmax picks exactly one, and two photos of the same thing must
  # land on the SAME label or they share nothing. `portrait`/`selfie`/`candid`/
  # `group of people` all mean "a photo of people" and split that mass five ways:
  # eleven family photos of one trip landed on nature ×4, group of people ×3,
  # selfie ×3, crowd ×1 — no two matched. They are collapsed to person/people/crowd
  # (how MANY, which is the part that differs), and how-it-was-taken moved to
  # `composition: selfie`. `clothing`/`product` fill the gaps that were forcing
  # wrong labels (torn jeans -> "selfie", a bottle of motor oil -> "screenshot").
  subject: [person, people, crowd, pet, dog, cat, bird, wildlife, food, drink, dessert, building, interior, nature, landscape, plant, flower, vehicle, car, boat, aircraft, document, text, screenshot, artwork, toy, clothing, product, sports]
  setting: [indoor, outdoor, beach, ocean, lake, river, mountain, hill, forest, park, garden, desert, field, city street, urban, suburban, rural, restaurant, cafe, bar, home, bedroom, kitchen, office, shop, museum, church, stadium, airport, station, water, snow]
  vibe: [cozy, energetic, serene, calm, moody, festive, nostalgic, dramatic, minimal, chaotic, romantic, playful, elegant, gritty, dreamy, epic]
  emotion: [joyful, happy, sad, tense, angry, surprised, affectionate, playful, contemplative, proud, bored, neutral]
  light: [golden hour, blue hour, sunrise, sunset, night, harsh midday, overcast, shade, backlit, side light, neon, candlelit, studio light, low light]
  season_weather: [summer, autumn, winter, spring, rain, snow, fog, storm, cloudy, clear sky, sunny, windy]
  composition: [close-up, macro, selfie, portrait orientation, wide shot, panorama, aerial, top-down, shallow depth of field, deep focus, symmetry, rule of thirds, silhouette, leading lines, patterns, negative space]
  palette: [warm, cool, pastel, vivid, saturated, muted, monochrome, black and white, sepia, dark, bright, high contrast, low contrast, earthy, neon]
  occasion: [birthday, wedding, party, graduation, travel, vacation, hike, camping, road trip, concert, festival, sports event, holiday, christmas, halloween, everyday, work, meeting]
  quality: [sharp, blurry, motion blur, noisy, grainy, overexposed, underexposed, well exposed, low resolution, high detail]

# What each label SAYS to SigLIP's text tower (§7), keyed by dimension then label.
# A label with no entry falls back to its dimension's template in ingest/taxonomy.py.
#
# This exists because the templates alone produce prompts SigLIP was never trained
# on — "a photo of portrait", "a photo of top-down", "a photo of work". Measured
# against a hand-labelled sample, the template-only `subject` was right 37% of the
# time; saying each label the way a caption would, and averaging over a couple of
# phrasings, took the same model to 80% (top-3: 68% -> 100%). No re-embedding of
# images is involved — only the label side changes, so a re-tag is cheap.
#
# Rules of thumb when editing: describe what would be VISIBLE, disambiguate labels
# that compete for the same photos, and give a label two phrasings when one alone
# reads oddly. Re-run "Reprocess all photos" (taxonomy) on /upload after editing.
prompts:
  subject:
    person: ["a photo of one person", "a portrait of a person"]
    people: ["a photo of two or more people together", "a photo of a family together"]
    crowd: ["a photo of a large crowd of people in a public place"]
    pet: ["a photo of a pet animal"]
    wildlife: ["a photo of a wild animal"]
    food: ["a photo of food", "a photo of a meal on a plate"]
    drink: ["a photo of a drink in a glass or cup"]
    dessert: ["a photo of a cake or dessert"]
