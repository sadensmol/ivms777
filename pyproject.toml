[project]
name = "ivms777"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "sqlite-vec>=0.1.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=2.5.2",
    "reverse-geocoder>=1.5.1",
    "pycountry>=26.2.16",
    "psutil>=7.2.2",
]

# The `models` service is the only process that loads torch/transformers
# (design §5.1, plan 15 task 6) — app/worker/ingest install core only, so the
# default `uv sync` stays torch-free and their image is slim. `einops` is required
# by the in-process caption-text embedder's custom modeling code
# (nomic-embed-text-v1.5, design §4). Since plan 16 there is no in-process caption
# VLM, so no bitsandbytes. `accelerate` IS needed — see the note on it below.
[project.optional-dependencies]
models = [
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "einops>=0.8",
    # Required by `from_pretrained(device_map=...)`, which is what keeps a model's
    # weights from being materialised in HOST RAM before the copy to the GPU.
    # Measured on the Jetson: `.to(device)` costs 5128 MB RSS, `device_map` 2940 MB —
    # the 2.2 GB difference is a host copy that is never freed (design §8.1).
    "accelerate>=1.0",
    # Feed audio (design §11.1). Models-service-only, exactly like torch itself, and
    # NOT installed by a plain `uv sync` — so no test may import `audio/`.
    # `kokoro` is the Apache-2.0 TTS (it needs the `espeak-ng` SYSTEM package for its
    # G2P). MusicGen needs nothing beyond `transformers`, which is already here — it
    # replaced Stable Audio Open, whose SDE sampler drives `torchsde` into
    # non-terminating recursion on this torch/Python stack (see audio/musicgen.py).
    "kokoro>=0.9.2",
    # kokoro's English G2P (misaki) loads this spaCy model, and when it is missing it
    # INSTALLS it at runtime (`uv pip install`) from inside the voice child — which
    # the next `uv sync` then removes, because the lockfile never knew it. The child
    # died mid-load on every restart ("could not speak en (EOFError)"). Declared, so
    # sync installs it and keeps it. The version follows spaCy's 3.8 compatibility.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # Voice copy (design §4.1): VoxCPM2 speaks a SAVED voice from its example clip.
    # Pinned: the child's conditioning blobs are bound to this exact version. mac/cloud only.
    "voxcpm==2.0.3",
    # The speaker-similarity meter (design §4.1): ECAPA-TDNN of a saved voice's takes and
    # a test. Pinned: `audio/speaker_embed.py` loads through this version's fetch API.
    "speechbrain==1.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The spaCy model in the `models` extra is a wheel URL (it is not on PyPI).
[tool.hatch.metadata]
allow-direct-references = true

# Flat layout: the source lives at the repo root (no package folder), so ship
# each top-level package plus the config module explicitly.
[tool.hatch.build.targets.wheel]
only-include = ["config.py", "albums", "audio", "captioning", "chat", "db", "embedding", "feed", "inference", "ingest", "models", "modelsvc", "organize", "search", "storage", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real model weights, deselected by default"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100

# voxcpm declares funasr, which pulls kaldiio (an evaluation-only licence); voxcpm 2.0.3 never imports funasr.
[tool.uv]
override-dependencies = ["funasr; sys_platform == 'never'"]
