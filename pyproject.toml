[project]
name = "ivms777"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "sqlite-vec>=0.1.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=2.5.2",
    "reverse-geocoder>=1.5.1",
    "pycountry>=26.2.16",
    "psutil>=7.2.2",
]

# The `models` service is the only process that loads torch/transformers
# (design §5.1, plan 15 task 6) — app/worker/ingest install core only, so the
# default `uv sync` stays torch-free and their image is slim. `einops` is required
# by the in-process caption-text embedder's custom modeling code
# (nomic-embed-text-v1.5, design §4). Since plan 16 there is no in-process caption
# VLM, so no bitsandbytes. `accelerate` IS needed — see the note on it below.
[project.optional-dependencies]
models = [
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "einops>=0.8",
    # Required by `from_pretrained(device_map=...)`, which is what keeps a model's
    # weights from being materialised in HOST RAM before the copy to the GPU.
    # Measured on the Jetson: `.to(device)` costs 5128 MB RSS, `device_map` 2940 MB —
    # the 2.2 GB difference is a host copy that is never freed (design §8.1).
    "accelerate>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat layout: the source lives at the repo root (no package folder), so ship
# each top-level package plus the config module explicitly.
[tool.hatch.build.targets.wheel]
only-include = ["config.py", "albums", "captioning", "chat", "db", "embedding", "inference", "ingest", "models", "modelsvc", "search", "storage", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real model weights, deselected by default"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
